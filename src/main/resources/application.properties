# ============================================================
# CampusLedger – Student Management System
# Application Configuration
# Author: Ranodeep Malik
# ============================================================

# Server port
server.port=8081

# Application name
spring.application.name=CampusLedger

# ============================================================
# MySQL Database Configuration
# IMPORTANT: Never commit real credentials here.
# Use environment variables or application-local.properties
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studentdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Spring Data JPA / Hibernate Configuration
# ============================================================

# update = safe for dev; create-drop resets on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Spring Security – Default user override
# Credentials defined in SecurityConfig.java (UserDetailsService bean)
# ============================================================

# Suppress the auto-generated password log line
logging.level.org.springframework.security=WARN

# ============================================================
# Logging
# ============================================================
logging.level.in.ranodeep.campusledger=DEBUG
logging.level.org.hibernate.SQL=DEBUG
